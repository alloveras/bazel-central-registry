matrix:
  platform: ["debian11", "ubuntu2404"]
  bazel: ["7.x", "8.x"]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@btrfs-progs//:btrfs"
      - "@btrfs-progs//cmds"
      - "@btrfs-progs//libbtrfs"
      - "@btrfs-progs//libbtrfsutil"
      - "@btrfs-progs//mkfs:mkfs.btrfs"
